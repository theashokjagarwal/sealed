name: SEALED Security, Determinism & Multi-Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit-and-verify:
    name: Python Core + C++17 Scanner + Java Verifier (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run All 9 Security, Air-Gap & Determinism Tests (Python)
        run: python3 tests/run_all_tests.py

      - name: Build & Smoke-Test C++17 Streaming PII Scanner
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -o native_cpp/sealed_fast_scanner native_cpp/sealed_fast_scanner.cpp
          set +e
          ./native_cpp/sealed_fast_scanner ./fixture-project
          CPP_EXIT=$?
          set -e
          test "$CPP_EXIT" -eq 1
          ./native_cpp/sealed_fast_scanner ./clean-project

      - name: Generate Deterministic Evidence & Verify with Java Verifier
        run: |
          set +e
          python3 sealed.py scan ./fixture-project --output-dir ./ci-run-1 --offline
          E1=$?
          python3 sealed.py scan ./fixture-project --output-dir ./ci-run-2 --offline
          E2=$?
          set -e
          test "$E1" -eq 1
          test "$E2" -eq 1
          diff -q ./ci-run-1/evidence.zip ./ci-run-2/evidence.zip

          javac java_cli/SealedVerifier.java
          java -cp java_cli SealedVerifier ./ci-run-1/evidence.zip

      - name: Upload Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed-evidence-${{ matrix.os }}
          path: |
            ./ci-run-1/report.html
            ./ci-run-1/evidence.zip
