[workspace]
members = [
    "crates/sealed-core",
    "crates/sealed-cli"
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["SEALED Authors"]
license = "Apache-2.0"
repository = "https://github.com/sealed-security/sealed"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
walkdir = "2.4"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
regex = "1.10"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
